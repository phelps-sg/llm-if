[tool.poetry]
name = "interactive-fiction-engine"
version = "0.1.0"
description = "AI-powered interactive fiction engine using Google Gemini"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0.0"
google-cloud-aiplatform = "^1.38.0"
pyyaml = "^6.0"
sexpdata = "^1.0.0"
click = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
if-engine = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
